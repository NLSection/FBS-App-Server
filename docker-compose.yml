# FBS server — Synology Container Manager / docker-compose.
#
# Dit is het opstartrecept voor eindgebruikers. Het wordt als
# `docker-compose.yml` in de root van de publieke FBS-App-Server-repo
# gepubliceerd; daar haalt de snelstart in de README hem vandaan.
#
# **Kanaal**: `:latest` van het pakket hieronder is het stabiele kanaal — dat
# is wat je wilt. Er bestaat daarnaast een testkanaal
# (`ghcr.io/nlsection/fbs-app-server-test`) met versies die de test-ronde nog
# niet doorstaan hebben; alleen gebruiken als je bewust meetest. Wisselen van
# kanaal = deze regel aanpassen en de container opnieuw aanmaken. Watchtower
# volgt altijd het pakket waarmee de container gestart is.
#
# **Netwerk-setup**:
#  - FBS draait op `network_mode: host` omdat Synology DSM's project-bridges
#    geen outbound NAT hebben (Plex/Sonarr/Bazarr volgen hetzelfde recept).
#    FBS bindt direct op `PORT=3210`.
#  - Watchtower draait wél in default bridge-mode met port-mapping
#    `127.0.0.1:8181:8080` (HTTP API-poort van Watchtower is hardcoded 8080;
#    `WATCHTOWER_HTTP_API_PORT` wordt niet gehonoreerd). Watchtower heeft geen
#    outbound netwerk nodig — image-pulls lopen via de Docker socket.
#  - FBS roept Watchtower aan via `http://127.0.0.1:8181` (host-loopback).
version: "3.8"

name: fbs-server

services:
  fbs:
    image: ghcr.io/nlsection/fbs-app-server:latest
    container_name: FBS-Server
    network_mode: host
    restart: unless-stopped
    volumes:
      # Bind-mount naar een share-folder zodat fbs.db zichtbaar is in File Station
      # en handmatig te backuppen via DSM. **Belangrijk:** deze map moet vóór
      # `Build` al bestaan, anders weigert Container Manager het project. Maak
      # 'm aan via File Station of: `mkdir -p /volume2/Docker/FBS/data`.
      - /volume2/Docker/FBS/data:/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/fbs.db
      - PORT=3210
      - HOSTNAME=0.0.0.0
      - FBS_SERVER_DEPLOYMENT=docker
      - FBS_WATCHTOWER_URL=http://127.0.0.1:8181
      - FBS_WATCHTOWER_TOKEN=fbs-internal
    labels:
      # Watchtower watcht alleen containers met deze label.
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3210/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower:latest
    container_name: FBS-Watchtower
    restart: unless-stopped
    # Default bridge-mode + port-mapping: Watchtower's HTTP API zit hardcoded
    # op 8080 binnen de container; we mappen naar 127.0.0.1:8181 zodat alleen
    # de FBS-container (host-mode) het kan bereiken, niet het LAN.
    ports:
      - "127.0.0.1:8181:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Alleen containers met label 'watchtower.enable=true' (zie fbs hierboven)
      - WATCHTOWER_LABEL_ENABLE=true
      # HTTP-API enabled, geen scheduled poll (alleen on-demand via FBS).
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=fbs-internal
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_NOTIFICATIONS=

  # Kanaalwissel: zet de server op de andere lijn (test of stabiel).
  #
  # Watchtower hierboven haalt alleen een nieuwere versie op van de lijn waar de server al
  # op staat; van lijn wisselen kan het niet. Dit hulpje wel: het kijkt of er een briefje in
  # de gegevensmap ligt met daarin 'test' of 'stabiel', en zet de server dan opnieuw neer op
  # het bijbehorende pakket. Dat briefje schrijft FBS zelf wanneer je in de instellingen van
  # kanaal wisselt.
  #
  # Alles wat er iets anders in staat wordt genegeerd. Geen poort, geen wachtwoord, geen
  # ingang van buitenaf: het hulpje kan maar een ding, met twee mogelijke uitkomsten.
  #
  # Laat je deze dienst weg, dan werkt de rest gewoon; alleen de knop om van kanaal te
  # wisselen doet dan niets.
  #
  # Let op: de map met dit bestand wordt op dezelfde plek gekoppeld als op de NAS zelf,
  # zodat de kenmerken van het project ongewijzigd blijven. Staat jouw project ergens
  # anders, pas dan beide paden hieronder aan.
  kanaalwissel:
    image: docker:27-cli
    container_name: FBS-Kanaalwissel
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume2/Docker/FBS:/volume2/Docker/FBS
    working_dir: /volume2/Docker/FBS
    entrypoint: ["/bin/sh", "/volume2/Docker/FBS/kanaalwissel.sh"]
